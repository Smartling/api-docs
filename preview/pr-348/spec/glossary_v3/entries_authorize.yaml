x-paths:

  authorize_for_translation:
    post:
      summary: Authorize glossary entries for translations.
      description: >-
        Allow to authorize entries for translation. Creates all required strings, authorize, then and add  to the JOB.
      tags:
        - Glossary API
      operationId: authorizeEntriesForTranslation
      parameters:
        - $ref: '../api_common.yaml#/components/parameters/accountUid'
        - $ref: './g_common.yaml#/components/parameters/glossaryUidPathParameter'
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeGlossaryEntriesPTO'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: './g_common.yaml#/components/schemas/AsyncOperationResponsePTO'
        400:
          $ref: './g_common.yaml#/components/responses/GlossaryError400ResponseDefinition'
        401:
          $ref: './g_common.yaml#/components/responses/GlossaryError401ResponseDefinition'
        403:
          $ref: './g_common.yaml#/components/responses/GlossaryError403ResponseDefinition'
        404:
          $ref: './g_common.yaml#/components/responses/GlossaryError404ResponseDefinition'
        429:
          $ref: './g_common.yaml#/components/responses/GlossaryError429ResponseDefinition'
        500:
          $ref: './g_common.yaml#/components/responses/GlossaryError500ResponseDefinition'


components:

  schemas:
    AuthorizeGlossaryEntriesPTO:
      type: object
      required:
        - filter
        - localeWorkflows
        - projectId
        - sourceLocale
      properties:
        sourceLocale:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/LocaleId'
          description: >-
            Source locale identifier.
            Basically, source locale of the project, both with localeId of the glossaryEntryTranslations to be authorized for translation.
        projectId:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/ProjectUid'
          description: Project id, where authorized content should be placed / where translation job will be created.
        filter:
          allOf:
            - $ref: './g_common.yaml#/components/schemas/GetGlossaryEntriesByFilterCommandPTO'
          description: >-
            Glossary entries filter.
            Filter for the data ( entries / entry-translations), which should be authorized.
        localeWorkflows:
          type: array
          minItems: 1
          description: Locale / workflow pairs array for the authorization process.
          items:
            $ref: "#/components/schemas/LocaleWorkflowPTO"
        missingTranslationsOnly:
          type: boolean
          default: false
          description: >-
            When true, locales that already have a translation for an entry are excluded from the submission.
          example: false
    LocaleWorkflowPTO:
      type: object
      required:
        - localeId
        - workflowUid
      properties:
        localeId:
          $ref: '../api_common.yaml#/components/schemas/LocaleId'
        workflowUid:
          type: string
          description: Workflow uid.
          example: acd1