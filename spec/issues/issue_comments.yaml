x-paths:
  issue_comments:
    get:
      summary: Get comments
      description: >-
        Returns the comments on an issue, one page at a time. Comments are
        ordered by creation, oldest first. Use `limit` and `offset` to page
        through them. `totalCount` is the number of all comments on the issue,
        not the number of comments on the returned page.


        **Note**: The `createdByUserUid` value is not currently usable for
        identifying the users who created comments. In the future, a People API
        will be exposed for looking up user details.
      tags:
        - Issues
      operationId: getIssueComments
      parameters:
        - $ref: '../api_common.yaml#/components/parameters/projectId'
        - description: Unique identifier of corresponding issue
          in: path
          name: issueUid
          required: true
          schema:
            type: string
        - description: >-
            Maximum number of comments to return. Must be between 1 and 500.
            An empty value is rejected.
          in: query
          name: limit
          required: false
          schema:
            default: 500
            maximum: 500
            minimum: 1
            type: integer
        - description: >-
            Number of comments to skip before the first returned comment. Must
            be 0 or greater. An empty value is rejected.
          in: query
          name: offset
          required: false
          schema:
            default: 0
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                response:
                  value:
                    response:
                      code: SUCCESS
                      data:
                        items:
                          - commentText: comment text
                            createdByUserUid: 661801f19693
                            createdDate: '2015-12-22T12:34:49Z'
                            issueCommentUid: a75fea779bbb
                        totalCount: 1
              schema:
                $ref: '#/components/schemas/IssueCommentsGetResponse'
          description: OK
        '400':
          x-summary: Invalid query parameter
          description: |-
            A query parameter is invalid. `details.field` contains the parameter name.

            | Parameter | Rule | Error `key` | Error `message` |
            |-----------|------|-------------|-----------------|
            | `limit` | Must not be empty | `NotNull` | must not be null |
            | `limit` | Must be 1 or greater | `Min` | must be greater than or equal to 1 |
            | `limit` | Must be 500 or less | `Max` | must be less than or equal to 500 |
            | `offset` | Must not be empty | `NotNull` | must not be null |
            | `offset` | Must be 0 or greater | `Min` | must be greater than or equal to 0 |
          content:
            application/json:
              schema:
                $ref: '../api_common.yaml#/components/schemas/Error400Response'
              examples:
                response:
                  value:
                    response:
                      code: VALIDATION_ERROR
                      errors:
                        - key: Max
                          message: must be less than or equal to 500
                          details:
                            field: limit
      x-code-samples:
        - lang: curl
          source: >
            curl -X GET -H "Authorization: Bearer $smartlingToken" -H
            "Content-Type: application/json"
            "https://api.smartling.com/issues-api/v2/projects/$smartlingProjectId/issues/$issueUid/comments?limit=100&offset=0"

    post:
      summary: Create comment
      description: >-
        Create a comment for an issue. Comment text is treated as plain text.
        Smartling will save the text as provided, and will not attempt to render
        this text with any special formatting in its UIs. It will not be
        rendered as HTML or markdown. If you're using the Issues API, escape the
        text as needed before attempting to render it. Maximum length is 4000
        characters.
      tags:
        - Issues
      operationId: addIssueComment
      parameters:
        - $ref: '../api_common.yaml#/components/parameters/projectId'
        - description: Unique identifier of corresponding issue
          in: path
          name: issueUid
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                response:
                  value:
                    response:
                      code: SUCCESS
                      data:
                        commentText: comment text
                        createdByUserUid: 661801f19693
                        createdDate: '2015-12-22T12:34:49Z'
                        issueCommentUid: a75fea779bbb
              schema:
                $ref: '#/components/schemas/IssueCommentAddResponse'
          description: OK
      x-code-samples:
        - lang: curl
          source: >
            curl -X POST -H "Authorization: Bearer $smartlingToken" -H
            "Content-Type: application/json" -d "$smartlingIssueCommentJSON"
            https://api.smartling.com/issues-api/v2/projects/$smartlingProjectId/issues/$issueUid/comments
  edit_issue_comment:
    put:
      summary: Edit comment text
      description: >-
        Replaces the text of an issue with new text.


        **Note**: Only the author of an issue can perform this action. The
        `commentTextModifiedDate` property of an issue object shows when it was
        last updated.


        Comment text is treated as plain text. Smartling will save the text as
        provided and will not attempt to render this text with any special
        formatting in its UIs. It will not be rendered as HTML or markdown. If
        you're using the Issues API, escape the text as needed before attempting
        to render it. Maximum length is 4000 characters.
      tags:
        - Issues
      operationId: updateIssueComment
      parameters:
        - $ref: '../api_common.yaml#/components/parameters/projectId'
        - description: Unique identifier of corresponding issue.
          in: path
          name: issueUid
          required: true
          schema:
            type: string
        - description: Unique identifier of corresponding issue commment.
          in: path
          name: issueCommentUid
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                response:
                  value:
                    response:
                      code: SUCCESS
                      data:
                        commentText: comment text
                        commentTextModifiedDate: '2016-12-22T12:34:49Z'
                        createdByUserUid: 661801f19693
                        createdDate: '2015-12-22T12:34:49Z'
                        issueCommentUid: a75fea779bbb
              schema:
                $ref: '#/components/schemas/IssueCommentEditResponse'
          description: OK
      x-code-samples:
        - lang: curl
          source: >
            curl -X PUT -H "Authorization: Bearer $smartlingToken" -H
            "Content-Type: application/json" -d "$smartlingIssueCommentJSON"
            https://api.smartling.com/issues-api/v2/projects/$smartlingProjectId/issues/$issueUid/comments/$issueCommentUid
    get:
      summary: Get comment details
      description: >-
        Returns detailed information on a single issue comment.


        **Note**: The `createdByUserUid` value is not currently usable for
        identifying the users who created comments. In the future, a People API
        will be exposed for looking up user details.
      tags:
        - Issues
      operationId: getIssueCommentDetails
      parameters:
        - $ref: '../api_common.yaml#/components/parameters/projectId'
        - description: Unique identifier of corresponding issue.
          in: path
          name: issueUid
          required: true
          schema:
            type: string
        - description: Unique identifier of corresponding issue comment.
          in: path
          name: issueCommentUid
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                response:
                  value:
                    response:
                      code: SUCCESS
                      data:
                        commentText: test comment
                        createdByUserUid: 661801f19693
                        createdDate: '2015-12-22T11:54:27Z'
                        issueCommentUid: ac5211a26eca
              schema:
                $ref: '#/components/schemas/IssueCommentGetResponse'
          description: OK
      x-code-samples:
        - lang: curl
          source: >
            curl -X GET -H "Authorization: Bearer $smartlingToken" -H
            "Content-Type: application/json"
            https://api.smartling.com/issues-api/v2/projects/$smartlingProjectId/issues/$issueUid/comments/$issueCommentUid
    delete:
      summary: Delete comment
      description: >-
        Delete comment.


        **Note**: The author of the issue comment, account owner and project manager can perform this action.
      tags:
        - Issues
      operationId: deleteIssueComment
      parameters:
        - $ref: '../api_common.yaml#/components/parameters/projectId'
        - description: Unique identifier of corresponding issue.
          in: path
          name: issueUid
          required: true
          schema:
            type: string
        - description: Unique identifier of corresponding issue commment.
          in: path
          name: issueCommentUid
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                response:
                  value:
                    response:
                      code: SUCCESS
              schema:
                $ref: '#/components/schemas/IssueCommentDeleteResponse'
          description: OK
      x-code-samples:
        - lang: curl
          source: >
            curl -X DELETE -H "Authorization: Bearer $smartlingToken" -H
            "Content-Type: application/json"
            https://api.smartling.com/issues-api/v2/projects/$smartlingProjectId/issues/$issueUid/comments/$issueCommentUid


components:
  schemas:
    CommentRequest:
      properties:
        commentText:
          description: Text of the comment you want to make.
          example: 'Hey, are you sure this is what you want?'
          type: string
      required:
        - commentText
      type: object
    IssueCommentAddResponse:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/SuccessResponse'
            - properties:
                data:
                  properties:
                    commentText:
                      description: Issue comment text
                      type: string
                    commentTextModifiedDate:
                      description: Issue comment modification date
                      type: string
                    createdByUserUid:
                      allOf:
                        - $ref: '../api_common.yaml#/components/schemas/UserUid'
                      description: User identifier who added comment
                    createdDate:
                      description: Issue comment creation date
                      type: string
                    issueCommentUid:
                      description: Issue comment identifier
                      type: string
                  type: object
              type: object
    IssueCommentsGetResponse:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/SuccessResponse'
            - properties:
                data:
                  properties:
                    items:
                      items:
                        properties:
                          commentText:
                            description: Issue comment text
                            type: string
                          commentTextModifiedDate:
                            description: Issue comment modification date
                            type: string
                          createdByUserUid:
                            allOf:
                              - $ref: '../api_common.yaml#/components/schemas/UserUid'
                            description: User identifier who added comment
                          createdDate:
                            description: Issue comment creation date
                            type: string
                          issueCommentUid:
                            description: Issue comment identifier
                            type: string
                        type: object
                      type: array
                    totalCount:
                      description: >-
                        Number of all comments on the issue, regardless of
                        `limit` and `offset`.
                      type: integer
                  type: object
              type: object
    IssueCommentEditResponse:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/SuccessResponse'
            - properties:
                data:
                  properties:
                    commentText:
                      description: Issue comment text
                      type: string
                    commentTextModifiedDate:
                      description: Issue comment modification date
                      type: string
                    createdByUserUid:
                      allOf:
                        - $ref: '../api_common.yaml#/components/schemas/UserUid'
                      description: User identifier who added comment
                    createdDate:
                      description: Issue comment creation date
                      type: string
                    issueCommentUid:
                      description: Issue comment identifier
                      type: string
                  type: object
              type: object
    IssueCommentGetResponse:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/SuccessResponse'
            - properties:
                data:
                  properties:
                    commentText:
                      description: Issue comment text
                      type: string
                    commentTextModifiedDate:
                      description: Issue comment modification date
                      type: string
                    createdByUserUid:
                      allOf:
                        - $ref: '../api_common.yaml#/components/schemas/UserUid'
                      description: User identifier who added comment
                    createdDate:
                      description: Issue comment creation date
                      type: string
                    issueCommentUid:
                      description: Issue comment identifier
                      type: string
                  type: object
              type: object
    IssueCommentDeleteResponse:
      type: object
      required:
        - response
      properties:
        response:
          $ref: '../api_common.yaml#/components/schemas/SuccessResponse'
