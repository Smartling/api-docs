components:

  schemas:

    GlossaryCommandPTO:
      type: object
      required:
        - glossaryName
        - localeIds
      properties:
        glossaryName:
          type: string
          maxLength: 170
          description: Name of the glossary, unique within the account. Character limit is equal to 170 characters.
          example: My new glossary
        description:
          type: string
          maxLength: 250
          description: Description of the glossary. Character limit is equal to 250 characters.
          example: Glossary created for common terms in scope of 'my-project'
        verificationMode:
          type: boolean
          description: Verification mode.
        localeIds:
          type: array
          description: Supported locale ids. Must not be empty; each locale must be a supported Smartling locale.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '../api_common.yaml#/components/schemas/LocaleId'
          example: [ "uk-UA","en","pt","pt-BR" ]
        fallbackLocales:
          type: array
          description: >-
            Fallback locales configuration. Items whose locales are not listed in `localeIds` are ignored.
          items:
            $ref: "#/components/schemas/FallbackLocaleCommandPTO"
      description: Glossary command.

    FallbackLocaleCommandPTO:
      type: object
      required:
        - fallbackLocaleId
        - localeIds
      properties:
        fallbackLocaleId:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/LocaleId'
          description: Fallback locale id.
          example: en
        localeIds:
          type: array
          description: Locales ids.
          items:
            $ref: '../api_common.yaml#/components/schemas/LocaleId'
          example: [ "en-US","en-ES" ]
      description: >-
        Configuration of the fallBack locale. Allow to select translations
        from fallback locale in case if requested locale does not provide translation  data.
    

    GlossariesArchiveUnarchiveCommandPTO:
      type: object
      required:
        - glossaryUids
      properties:
        glossaryUids:
          type: array
          description: Glossary uids fot the archive / restore operation.
          items:
            type: string
          example: [ "58966072-6569-4c22-930c-de906b7fb18d", "12366072-6569-4c22-930c-de906b7fb18d" ]
      description: Archive / restore glossaries command.


    GetGlossariesByFilterCommandPTO:
      type: object
      properties:
        query:
          type: string
          description: >-
            Allow to search glossaries by query in scope of glossaryName or description properties.
            Also supports exact search by glossaryUid: if `query` is a UUID, it is matched as a glossaryUid
            and `glossaryState` is ignored (BOTH is used).
          example: some name
        glossaryState:
          type: string
          description: >-
            Glossary state. ACTIVE is used if omitted.
            Ignored (BOTH is used) when `glossaryUids` is passed.
          enum:
            - ACTIVE
            - ARCHIVED
            - BOTH
          example: BOTH
        targetLocaleId:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/LocaleId'
          description: Filter glossaries that have passed locale - preconfigured.
          example: uk-UA
        glossaryUids:
          type: array
          description: GlossaryUids filter.
          items:
            type: string
          example: [ "58966072-6569-4c22-930c-de906b7fb18d", "12366072-6569-4c22-930c-de906b7fb18d" ]
        paging:
          allOf:
            - $ref: "./g_common.yaml#/components/schemas/PaginationCommandPTO"
          description: >-
            Paging options for the filter.
        sorting:
          allOf:
            - $ref: "#/components/schemas/SortCommandPTO"
          description: >-
            Sorting command. Sort fields are - 'glossaryName | createdDate | lastModifiedDate'.
            Default is lastModifiedDate DESC.
      description: Glossaries filter.

    GetGlossariesWithEntriesCountByFilterCommandPTO:
      allOf:
        - $ref: "#/components/schemas/GetGlossariesByFilterCommandPTO"
        - type: object
          properties:
            includeEntriesCount:
              type: boolean
              description: >-
                Allow to exclude / include glossary entries count, for each  glossary that was found by the criteria.
          description: >-
            Glossary filter that adds additional glossaries entry count property into the search glossaries by filter result.

    SortCommandPTO:
      type: object
      properties:
        field:
          type: string
          enum:
            - glossaryName
            - createdDate
            - lastModifiedDate
          description: Sorting field.
        direction:
          type: string
          enum:
            - ASC
            - DESC
          description: Sorting direction.
      description: Sorting options for the filter.

    GlossaryResponse:
      type: object
      properties:
        glossaryUid:
          type: string
          description: Glossary uid.
          example: 58966072-6569-4c22-930c-de906b7fb18d
        accountUid:
          type: string
          description: Account uid.
          example: 56a0b220
        glossaryName:
          type: string
          description: Glossary name.
          example: CF-enabled-glossary-V2
        description:
          type: string
          description: Glossary description.
        verificationMode:
          type: boolean
          description: Glossary verificationMode.
        archived:
          type: boolean
          description: >-
            Glossary archived. In case if {@code true} set, then glossary is archived.
        createdByUserUid:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/UserUid'
          description: Uid of the glossary creator.
        modifiedByUserUid:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/UserUid'
          description: Uid of the user who had last modified glossary.
        createdDate:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/DateTime'
          description: Glossary creation date.
        modifiedDate:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/DateTime'
          description: Glossary last modification date.
        localeIds:
          type: array
          description: Locale ids that  current glossary supports.
          items:
            $ref: '../api_common.yaml#/components/schemas/LocaleId'
          example: [ "en", "en-US", "hi-IN", "pl-PL", "uk-UA" ]
        fallbackLocales:
          type: array
          description: Fallback locales configuration.
          items:
            $ref: "#/components/schemas/FallbackLocalePTO"
      description: Glossary response.

    FallbackLocalePTO:
      type: object
      properties:
        fallbackLocaleId:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/LocaleId'
          description: fallback locale id.
          example: en
        localeIds:
          type: array
          description: Locale ids.
          items:
            $ref: '../api_common.yaml#/components/schemas/LocaleId'
          example: [ "en-US" ]
      description: Fallback locale configuration.

    GlossaryResponsePTO:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: "../api_common.yaml#/components/schemas/SuccessResponse"
            - type: object
              properties:
                data:
                  $ref: "#/components/schemas/GlossaryResponse"


    GlossariesArchiveUnarchivedResponse:
      type: object
      properties:
        glossaryUids:
          type: array
          description: Uids of the glossaries on which operation was performed.
          items:
            type: string
          example: [ "58966072-6569-4c22-930c-de906b7fb18d" ]
      description: Result of the bulk archive / restore operation on glossary.

    GlossariesArchiveUnarchivedResponsePTO:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: "../api_common.yaml#/components/schemas/SuccessResponse"
            - type: object
              properties:
                data:
                  $ref: "#/components/schemas/GlossariesArchiveUnarchivedResponse"

    GlossarySearchListResponsePTO:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: "../api_common.yaml#/components/schemas/SuccessResponse"
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    totalCount:
                      type: integer
                      format: int64
                      description: total glossaries amount
                    items:
                      type: array
                      items:
                        $ref: "#/components/schemas/GlossarySearchResponsePTO"

    GlossarySearchResponsePTO:
      allOf:
        - $ref: "#/components/schemas/GlossaryResponse"
        - type: object
          properties:
            entriesCount:
              type: integer
              format: int32
              description: >-
                Amount of entries in current glossary. `null` unless `includeEntriesCount` is true.
            lastOptimization:
              type: object
              description: Last completed MT optimization summary for the glossary.
              properties:
                optimizedEntriesCount:
                  type: integer
                  format: int32
                  description: Amount of MT-optimized entries.
                showWarn:
                  type: boolean
          description: Glossary response extended with `entriesCount` and `lastOptimization`.

    GlossaryEntriesCountsSuccessResponsePTO:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: "../api_common.yaml#/components/schemas/SuccessResponse"
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    totalCount:
                      type: integer
                      format: int64
                      description: total items amount
                    items:
                      type: "array"
                      items:
                        $ref: "#/components/schemas/GlossaryEntriesCountsResponsePTO"

    GlossaryEntriesCountsResponsePTO:
      type: object
      properties:
        glossaryUid:
          type: string
          description: Glossary uid.
          example: 58966072-6569-4c22-930c-de906b7fb18d
        entriesCount:
          type: integer
          format: int32
          description: Glossary entries amount.
        blocklistsCount:
          type: integer
          format: int32
          description: Attached blocklists amount.
      description: >-
        Result of the search/count operation. Show amount of  entries  blocklists ( attached ) to current glossary.
