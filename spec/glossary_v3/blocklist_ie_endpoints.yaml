x-paths:

  blocklist_export_terms:
    get:
      summary: Export blocklist terms
      description: >-
        This request export blocklist terms into file with preselected format.
        For now next formats are allowed:
         - CSV,
         - XLSX.
      tags:
        - Blocklist API
      operationId: exportBlocklist
      parameters:
        - $ref: '../api_common.yaml#/components/parameters/accountUid'
        - $ref: './g_common.yaml#/components/parameters/blocklistUidPathParameter'
        - $ref: '#/components/parameters/exportFormat'
        - $ref: '#/components/parameters/skipEntriesParam'

      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
        400:
          $ref: './g_common.yaml#/components/responses/GlossaryError400ResponseDefinition'
        401:
          $ref: './g_common.yaml#/components/responses/GlossaryError401ResponseDefinition'
        403:
          $ref: './g_common.yaml#/components/responses/GlossaryError403ResponseDefinition'
        404:
          $ref: './g_common.yaml#/components/responses/GlossaryError404ResponseDefinition'
        429:
          $ref: './g_common.yaml#/components/responses/GlossaryError429ResponseDefinition'
        500:
          $ref: './g_common.yaml#/components/responses/GlossaryError500ResponseDefinition'

  blocklist_initialize_import:
    post:
      tags:
        - Blocklist API
      summary: Initialize blocklist import process
      description: >-
        Initialize blocklist import process. Upload file, and perform validation.
        ( No changes will be done during this method call ). In case of success
        blocklist import will be created with 'PENDING' status.
      operationId: initializeBlocklistImport
      parameters:
        - $ref: '../api_common.yaml#/components/parameters/accountUid'
        - $ref: './g_common.yaml#/components/parameters/blocklistUidPathParameter'
      requestBody:
        description: ''
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlocklistImportCommandPTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistImportResponsePTO'

        400:
          $ref: './g_common.yaml#/components/responses/GlossaryError400ResponseDefinition'
        401:
          $ref: './g_common.yaml#/components/responses/GlossaryError401ResponseDefinition'
        403:
          $ref: './g_common.yaml#/components/responses/GlossaryError403ResponseDefinition'
        404:
          $ref: './g_common.yaml#/components/responses/GlossaryError404ResponseDefinition'
        429:
          $ref: './g_common.yaml#/components/responses/GlossaryError429ResponseDefinition'
        500:
          $ref: './g_common.yaml#/components/responses/GlossaryError500ResponseDefinition'
      x-code-samples:
        - lang: curl
          source: >
            curl -X POST -H "Authorization: Bearer $smartlingToken"
            -F "importFile=@$uploadFilePath"
            "https://api.smartling.com/glossary-api/v3/accounts/$smartlingAccountUid/blocklists/$smartlingBlocklistUid/import"

  blocklist_import_status:
    get:
      tags:
        - Blocklist API
      summary: Read import process status
      description: >-
        Read import process status
      operationId: blocklistImportStatus
      parameters:
        - $ref: '../api_common.yaml#/components/parameters/accountUid'
        - $ref: './g_common.yaml#/components/parameters/blocklistUidPathParameter'
        - $ref: '#/components/parameters/importUidPathParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistImportPTO'

        400:
          $ref: './g_common.yaml#/components/responses/GlossaryError400ResponseDefinition'
        401:
          $ref: './g_common.yaml#/components/responses/GlossaryError401ResponseDefinition'
        403:
          $ref: './g_common.yaml#/components/responses/GlossaryError403ResponseDefinition'
        404:
          $ref: './g_common.yaml#/components/responses/GlossaryError404ResponseDefinition'
        429:
          $ref: './g_common.yaml#/components/responses/GlossaryError429ResponseDefinition'
        500:
          $ref: './g_common.yaml#/components/responses/GlossaryError500ResponseDefinition'

  blocklist_confirm_import:
    post:
      tags:
        - Blocklist API
      summary: Confirm previously created blocklist import

      description: >-
        Confirm previously created blocklist import. Only imports in status : 'PENDING' may be confirmed.
      operationId: confirmBlocklistImport
      parameters:
        - $ref: '../api_common.yaml#/components/parameters/accountUid'
        - $ref: './g_common.yaml#/components/parameters/blocklistUidPathParameter'
        - $ref: '#/components/parameters/importUidPathParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistImportPTO'

        400:
          $ref: './g_common.yaml#/components/responses/GlossaryError400ResponseDefinition'
        401:
          $ref: './g_common.yaml#/components/responses/GlossaryError401ResponseDefinition'
        403:
          $ref: './g_common.yaml#/components/responses/GlossaryError403ResponseDefinition'
        404:
          $ref: './g_common.yaml#/components/responses/GlossaryError404ResponseDefinition'
        429:
          $ref: './g_common.yaml#/components/responses/GlossaryError429ResponseDefinition'
        500:
          $ref: './g_common.yaml#/components/responses/GlossaryError500ResponseDefinition'
      x-code-samples:
        - lang: curl
          source: >
            curl -X POST -H "Authorization: Bearer $smartlingToken"
            "https://api.smartling.com/glossary-api/v3/accounts/$smartlingAccountUid/blocklists/$smartlingBlocklistUid/import/$importUid/confirm"

components:
  parameters:
    importUidPathParameter:
      name: importUid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the glossary-import.
      example: 69dae398-96c2-45f6-9f0d-91470c3464bd

    exportFormat:
      name: format
      in: query
      schema:
        type: string
        enum:
          - CSV
          - XLSX
      required: true
      example: CSV
      description: Export format, one of CSV, XLSX.

    skipEntriesParam:
      name: skipEntries
      in: query
      schema:
        type: boolean
      required: false
      description: Will export template ( headers ) only in case if - value set to true.

  schemas:

    BlocklistImportCommandPTO:
      type: object
      required:
        - importFile
      properties:
        importFile:
          type: string
          format: binary
          description: Binary file data to upload (CSV or XLSX).
        importFileName:
          type: string
          description: >-
            Name and extension of the import file. Optional: used to detect the format
            when it can't be detected from the uploaded file name.
        importFileMediaType:
          type: string
          enum:
            - text/csv
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          description: Import file media type. One of 'text/csv |  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'. Only needed when the file name of the uploaded file part has no supported extension.
      description: Blocklist import command.

    BlocklistImportResponse:
      type: object
      properties:
        blocklistImport:
          allOf:
            - $ref: '#/components/schemas/BlocklistImport'
          description: BlocklistImport meta-data.
        termChanges:
          allOf:
            - $ref: '#/components/schemas/ImportTermChanges'
          description: Term changes stats.
      description: Blocklist import meta-data.

    BlocklistImport:
      type: object
      properties:
        blocklistUid:
          type: string
          format: uuid
          example : 'bad90990-4be1-4570-81da-b719cddd5352'
          description: Blocklist uid.
        importUid:
          type: string
          format: uuid
          example : '939a4439-2ed0-4123-bc68-d188e4d664ab'
          description: Import uid.
        importStatus:
          type: string
          description: Status of the import.
          example: PENDING
          enum:
            - PENDING
            - IN_PROGRESS
            - SUCCESSFUL
            - FAILED
      description: Blocklist import process meta-data.

    ImportTermChanges:
      type: object
      properties:
        newTerms:
          type: integer
          format: int32
          example : 50
          description: Amount of blocklist terms to be created.
        existingTermUpdates:
          type: integer
          format: int32
          example : 100
          description: Amount of blocklist terms to be updated.
      description: Blocklist term change stats.

    BlocklistImportResponsePTO:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: "../api_common.yaml#/components/schemas/SuccessResponse"
            - type: object
              properties:
                data:
                  $ref: "#/components/schemas/BlocklistImportResponse"

    BlocklistImportPTO:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: "../api_common.yaml#/components/schemas/SuccessResponse"
            - type: object
              properties:
                data:
                  $ref: "#/components/schemas/BlocklistImport"

