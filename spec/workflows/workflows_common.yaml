components:
  schemas:

    # ---- Enums ----

    WorkflowStepType:
      type: string
      description: |
        Functional class of a workflow step. `AUTHORIZE` and `PLACEHOLDER` gate
        content entry; `ANALYSIS` and `SYSTEM` are non-human processing steps;
        `TRANSLATION`, `POST_TRANSLATION`, `WORK_APPROVAL`, `ADMIN_APPROVAL`, and
        `BACK_TRANSLATION` are human work steps; `DECISION` branches the route;
        `PUBLISH` is the terminal step of a route.
      enum:
        - AUTHORIZE
        - PLACEHOLDER
        - TRANSLATION
        - POST_TRANSLATION
        - PUBLISH
        - ADMIN_APPROVAL
        - ANALYSIS
        - WORK_APPROVAL
        - DECISION
        - SYSTEM
        - BACK_TRANSLATION
      example: TRANSLATION

    WorkflowActionType:
      type: string
      description: Type of transition a workflow action represents.
      enum:
        - TRANSLATION_SUBMITTED
        - EDIT
        - REVIEW
        - MOVE
        - REJECT
        - POST_MACHINE_REVISION
        - DECISION
        - MONOLINGUAL_REVIEW
        - TRANSCREATION_SUBMITTED
        - TRANSCREATION_REVIEW
        - POST_MACHINE_REVISION_PRO
        - QUALITY_EVALUATION
        - QUALITY_EVALUATION_PRO
        - INTERNAL_REVIEW
        - DESKTOP_PUBLISHING
        - TRANSLATION_AIT_SUBMITTED
        - POST_AIT_REVISION
        - BACK_TRANSLATION
        - MEDIA_EDIT
      example: TRANSLATION_SUBMITTED

    AutoPrePublishType:
      type: string
      description: When a step automatically pre-publishes content, if at all.
      enum:
        - NONE
        - SUBMIT
        - SAVE
      example: NONE

    LocalePairManagementType:
      type: string
      description: |
        How a workflow's locale-pair coverage is managed: `CUSTOM` (account-level
        workflow with its own explicit locale pairs), `PROJECT` (project-level
        workflow), or `LOCKED` (locale pairs fixed by the system).
      enum:
        - CUSTOM
        - PROJECT
        - LOCKED
      example: CUSTOM

    WorkflowTemplate:
      type: string
      description: Predefined workflow shape to seed a new workflow from.
      enum:
        - TRANSLATION_WORKFLOW
        - TRANSCREATION_WORKFLOW
        - AI_TRANSLATION_WORKFLOW
        - AI_HUMAN_IN_LOOP_WORKFLOW
        - MEDIA_TRANSLATION_WORKFLOW
      example: TRANSLATION_WORKFLOW

    # ---- Shared value types ----

    LocaleRef:
      type: object
      description: A locale identifier with its human-readable description.
      required:
        - localeId
      properties:
        localeId:
          type: string
          example: en-US
        description:
          type: [string, "null"]
          description: Human-readable locale name. `null` when not resolved.
          example: English (United States)

    LocalePair:
      type: object
      description: A source/target locale pair.
      required:
        - sourceLocale
        - targetLocale
      properties:
        sourceLocale:
          $ref: '#/components/schemas/LocaleRef'
        targetLocale:
          $ref: '#/components/schemas/LocaleRef'

    LocalePairInput:
      type: object
      description: A source/target locale pair, identified by locale ID only.
      required:
        - sourceLocale
        - targetLocale
      properties:
        sourceLocale:
          type: object
          required:
            - localeId
          properties:
            localeId:
              type: string
              example: en-US
        targetLocale:
          type: object
          required:
            - localeId
          properties:
            localeId:
              type: string
              example: fr-FR

    WorkflowAction:
      type: object
      description: A transition from one workflow step to another.
      required:
        - primary
        - actionType
        - nextWorkflowStepUid
      properties:
        primary:
          type: boolean
          description: Whether this is the step's primary (default) forward action.
        actionType:
          $ref: '#/components/schemas/WorkflowActionType'
        nextWorkflowStepUid:
          description: UID of the step this action transitions to.
          $ref: '../api_common.yaml#/components/schemas/WorkflowStepUid'

    WorkflowStepConfiguration:
      type: object
      description: A workflow step as returned nested inside a workflow's configuration.
      required:
        - workflowStepUid
        - workflowStepName
        - workflowStepType
        - workflowStepOrder
        - actions
      properties:
        workflowStepUid:
          $ref: '../api_common.yaml#/components/schemas/WorkflowStepUid'
        workflowStepName:
          type: string
          example: Translation
        workflowStepType:
          $ref: '#/components/schemas/WorkflowStepType'
        workflowStepOrder:
          type: integer
          description: Position of the step within its route, starting at 1.
          example: 1
        matchScore:
          type: [number, "null"]
          description: Minimum Translation Memory match score required to prepopulate content on this step. `null` when not applicable.
          example: null
        autoPrePublishType:
          $ref: '#/components/schemas/AutoPrePublishType'
        claimingEnabled:
          type: boolean
          description: Whether translators must claim content before working on it.
        assignmentEnabled:
          type: boolean
          description: Whether content on this step can be assigned to specific users.
        submitOnSaveEnabled:
          type: boolean
          description: Whether saving content automatically submits it to the next step.
        translatorCanEditEnabled:
          type: boolean
          description: Whether translators can edit content on this step.
        offlineTranslationEnabled:
          type: boolean
          description: Whether content on this step can be translated offline.
        canEditPublishStepEnabled:
          type: boolean
          description: Whether editors can edit already-published content from this step.
        configurationUid:
          type: [string, "null"]
          description: UID of the external provider configuration assigned to this step, if any.
          example: null
        managedWorkflowStep:
          type: boolean
          description: Whether this step is managed by Smartling and cannot be freely reconfigured.
        foundationProfile:
          type: [string, "null"]
          description: Foundation AI translation profile assigned to this step, if any.
          example: null
        actions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowAction'

    WorkflowStepSummary:
      type: object
      description: A workflow step returned by direct step lookup, identifying its parent workflow.
      required:
        - workflowUid
        - workflowName
        - workflowStepUid
        - workflowStepName
        - workflowStepType
        - workflowStepOrder
        - actions
      properties:
        workflowUid:
          $ref: '../api_common.yaml#/components/schemas/WorkflowUid'
        workflowName:
          type: string
          example: WF-0
        workflowStepUid:
          $ref: '../api_common.yaml#/components/schemas/WorkflowStepUid'
        workflowStepName:
          type: string
          example: Human Translation
        workflowStepType:
          $ref: '#/components/schemas/WorkflowStepType'
        workflowStepOrder:
          type: integer
          description: Position of the step within its route, starting at 1.
          example: 3
        claimingEnabled:
          type: boolean
          description: Whether translators must claim content before working on it.
        assignmentEnabled:
          type: boolean
          description: Whether content on this step can be assigned to specific users.
        offlineTranslationEnabled:
          type: boolean
          description: Whether content on this step can be translated offline.
        managedWorkflowStep:
          type: boolean
          description: Whether this step is managed by Smartling and cannot be freely reconfigured.
        canEditPublishStepEnabled:
          type: boolean
          description: Whether editors can edit already-published content from this step.
        foundationProfile:
          type: [string, "null"]
          description: Foundation AI translation profile assigned to this step, if any.
          example: null
        actions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowAction'

    # ---- Request schemas ----

    WorkflowAddCommand:
      type: object
      description: |
        Creates a workflow either from scratch (`workflowName` and `contentTypeUid`)
        or seeded from a `workflowTemplate`. When `projectId` is supplied, the
        workflow is created as a project-level workflow; otherwise it is
        account-level.
      required:
        - workflowName
        - contentTypeUid
      properties:
        projectId:
          type: string
          description: Create the workflow as project-level, scoped to this project.
          pattern: '^[a-z0-9]{9}$'
          example: 4f2d6138c
        workflowName:
          type: string
          example: PWF-C
        contentTypeUid:
          type: string
          description: UID of the content type this workflow applies to.
          example: e38e7731d
        workflowTemplate:
          $ref: '#/components/schemas/WorkflowTemplate'
        paidWorkflow:
          type: boolean
          default: false
        managedWorkflow:
          type: boolean
          default: false
        localePairs:
          type: array
          description: Locale pairs the workflow covers.
          items:
            $ref: '#/components/schemas/LocalePairInput'

    WorkflowStepUidsCommand:
      type: object
      description: A batch of workflow step UIDs to look up.
      required:
        - workflowStepUids
      properties:
        workflowStepUids:
          type: array
          description: Workflow step UIDs to look up. Maximum 1000 entries.
          maxItems: 1000
          items:
            $ref: '../api_common.yaml#/components/schemas/WorkflowStepUid'

    # ---- Response schemas ----

    WorkflowConfigurationResponse:
      type: object
      properties:
        response:
          type: object
          properties:
            code:
              type: string
              enum: [SUCCESS]
            data:
              type: object
              properties:
                workflowUid:
                  $ref: '../api_common.yaml#/components/schemas/WorkflowUid'
                workflowName:
                  type: string
                  example: PWF-C
                contentTypeUid:
                  type: string
                  example: e38e7731d
                localePairManagementType:
                  $ref: '#/components/schemas/LocalePairManagementType'
                canModify:
                  type: boolean
                updateDate:
                  type: [integer, "null"]
                  description: Epoch milliseconds of the last update. `null` for a workflow that has never been updated.
                  example: null
                paidWorkflow:
                  type: boolean
                managedWorkflow:
                  type: boolean
                foundationWorkflow:
                  type: boolean
                localePairs:
                  type: array
                  items:
                    $ref: '#/components/schemas/LocalePair'
                workflowSteps:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowStepConfiguration'

    WorkflowStepResponse:
      type: object
      properties:
        response:
          type: object
          properties:
            code:
              type: string
              enum: [SUCCESS]
            data:
              $ref: '#/components/schemas/WorkflowStepSummary'

    WorkflowStepListResponse:
      type: object
      properties:
        response:
          type: object
          properties:
            code:
              type: string
              enum: [SUCCESS]
            data:
              type: object
              properties:
                totalCount:
                  type: integer
                  example: 2
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowStepSummary'

    # ---- Errors not already covered by api_common.yaml ----

    Error403Response:
      type: object
      properties:
        response:
          type: object
          required:
            - code
            - errors
          properties:
            code:
              type: string
              enum: [ACCESS_DENIED_ERROR]
            errors:
              type: array
              items:
                $ref: '../api_common.yaml#/components/schemas/Error'
      required:
        - response

    Error404Response:
      type: object
      properties:
        response:
          type: object
          required:
            - code
            - errors
          properties:
            code:
              type: string
              enum: [NOT_FOUND_ERROR]
            errors:
              type: array
              items:
                $ref: '../api_common.yaml#/components/schemas/Error'
      required:
        - response

  responses:
    Error403ResponseDefinition:
      description: The caller does not have permission to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403Response'
          examples:
            response:
              value:
                response:
                  code: ACCESS_DENIED_ERROR
                  errors:
                    key: no.access
                    message: Access denied.

    Error404ResponseDefinition:
      description: The requested resource was not found or is not accessible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404Response'
          examples:
            response:
              value:
                response:
                  code: NOT_FOUND_ERROR
                  errors:
                    key: workflow.step.not.found
                    message: Workflow step not found.
