components:
  parameters:
    fileUidPathParameter:
      name: fileUid
      in: path
      schema:
        type: string
      required: true
      description: Unique identifier of the uploaded file.

    mtUidPathParameter:
      name: mtUid
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of machine translation action triggered on a file.

    languageDetectionUidPathParameter:
      name: languageDetectionUid
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of language detection action triggered on a file.

  schemas:
    FileTranslationEmptyResponse:
      type: object
      required:
        - response
      properties:
        response:
          allOf:
            - $ref: '../api_common.yaml#/components/schemas/SuccessResponse'
            - properties:
                data:
                  description: Always empty.
                  type: object
                  example: {}
              type: object
    AcceptedResponse:
      properties:
        code:
          description: >-
            Indicates whether the response was successful or what error has occurred.
          enum:
            - ACCEPTED
          type: string
      required:
        - code
      type: object
    FileTranslationError400Response:
      type: object
      properties:
        response:
          properties:
            code:
              description: >-
                Indicates whether the response was successful or what error has occurred.
              enum:
                - VALIDATION_ERROR
              type: string
            errors:
              items:
                $ref: '#/components/schemas/FileTranslationError'
              type: array
          required:
            - code
            - errors
          type: object
      required:
        - response
    FileTranslationError:
      type: object
      properties:
        key:
          description: Error key
          example: generalError
          type: string
        message:
          description: Human readable description of the error
          example: 'Sorry, something went wrong. We notified the responsible team. If you still need to contact us please provide this error code: jtcorrr3'
          type: string
        details:
          description: Details of the occurred error.
          example: '{"errorId": "jtcorrr3"}'
          type: object
      required:
        - key
        - message
  responses:
    Error400ResponseDefinition:
      description: Provided request parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileTranslationError400Response'
          examples:
            response:
              value:
                response:
                  code: VALIDATION_ERROR
                  errors:
                    key: not.found
                    message: >-
                      mtUid jtcorrr3 not found
                    details:
                      mtUid: jtcorrr3
